<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abhijeet Vaibhav | IIT Bombay</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    rel="stylesheet"
  />
   <link rel="icon" type="image/png" href="favicon.png">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    :root{
      --bg:#050816;
      --card:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.08);
      --text:#ffffff;
      --sub:#cfcfcf;
      --accent:#7c5cff;
      --accent2:#5ce1e6;
    }

    html,body{
      width:100%;
      min-height:100%;
      overflow-x:hidden;
      scroll-behavior:smooth;
      font-family:'Inter',sans-serif;
      background:#050816;
      color:white;
    }

    body{
      background:
      radial-gradient(circle at top left, rgba(124,92,255,0.22), transparent 22%),
      radial-gradient(circle at bottom right, rgba(92,225,230,0.15), transparent 22%),
      linear-gradient(135deg,#050816,#071126,#0f172a);
    }

    /* =========================
       STAR BACKGROUND
    ========================= */

    .stars{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      overflow:hidden;
      pointer-events:none;
    }

    .star{
      position:absolute;
      width:2px;
      height:2px;
      border-radius:50%;
      background:white;

      box-shadow:
      0 0 8px rgba(255,255,255,1),
      0 0 15px rgba(124,92,255,0.9),
      0 0 22px rgba(92,225,230,0.8);

      animation:moveStars linear infinite;
      opacity:.9;
    }

    .star.big{
      width:4px;
      height:4px;
    }

    @keyframes moveStars{

      0%{
        transform:
        translateY(-10vh)
        scale(.8);

        opacity:0;
      }

      10%{
        opacity:1;
      }

      100%{
        transform:
        translateY(110vh)
        scale(1.3);

        opacity:0;
      }
    }

    /* =========================
       ELECTRICITY EFFECT
    ========================= */

    .electricity{
      position:absolute;
      bottom:-20px;
      left:0;
      width:100%;
      height:260px;
      overflow:hidden;
      pointer-events:none;
      z-index:2;
    }

    .bolt{
      position:absolute;
      bottom:0;
      width:3px;
      border-radius:50px;

      background:
      linear-gradient(
        to top,
        rgba(92,225,230,1),
        rgba(124,92,255,.9),
        rgba(255,255,255,0)
      );

      box-shadow:
      0 0 12px rgba(92,225,230,1),
      0 0 30px rgba(124,92,255,.8),
      0 0 60px rgba(92,225,230,.7);

      animation:
      lightningMove linear infinite;
    }

    @keyframes lightningMove{

      0%{
        transform:
        translateY(100px)
        scaleY(.2);

        opacity:0;
      }

      10%{
        opacity:1;
      }

      50%{
        transform:
        translateY(-40px)
        scaleY(1);
      }

      100%{
        transform:
        translateY(-260px)
        scaleY(1.4);

        opacity:0;
      }
    }

    /* =========================
       GLOW BLOBS
    ========================= */

    .blob{
      position:fixed;
      width:550px;
      height:550px;
      border-radius:50%;

      background:
      radial-gradient(
        circle,
        rgba(124,92,255,0.28),
        transparent 70%
      );

      filter:blur(90px);

      top:-120px;
      right:-120px;

      z-index:0;

      animation:
      blobMove 10s
      ease-in-out
      infinite alternate;
    }

    @keyframes blobMove{

      from{
        transform:
        translateY(0px)
        scale(1);
      }

      to{
        transform:
        translateY(60px)
        scale(1.18);
      }
    }

    /* =========================
       NAVBAR
    ========================= */

    #top-nav{
      display:none;

      position:fixed;

      top:0;
      left:0;
      right:0;

      height:72px;

      padding:0 3rem;

      align-items:center;
      justify-content:space-between;

      background:rgba(255,255,255,0.04);

      backdrop-filter:blur(18px);

      border-bottom:
      1px solid rgba(255,255,255,0.08);

      z-index:100;
    }

    .nav-logo{
      font-size:1.2rem;
      font-weight:800;
      letter-spacing:1px;
    }

    .nav-links{
      display:flex;
      gap:2rem;
    }

    .nav-links span{
      position:relative;
      cursor:pointer;
      color:#d0d0d0;
      transition:.3s ease;
    }

    .nav-links span:hover,
    .nav-links span.active{
      color:var(--accent2);
    }

    .nav-links span::after{
      content:'';

      position:absolute;

      left:0;
      bottom:-6px;

      width:0;
      height:2px;

      background:
      linear-gradient(
        90deg,
        var(--accent),
        var(--accent2)
      );

      transition:.3s ease;
    }

    .nav-links span:hover::after,
    .nav-links span.active::after{
      width:100%;
    }

    /* =========================
       LANDING PAGE
    ========================= */

    #landing-page{
      position:relative;
      min-height:100vh;

      display:flex;
      flex-direction:column;

      align-items:center;
      justify-content:center;

      text-align:center;

      padding:2rem;

      overflow:hidden;

      z-index:3;
    }

    #landing-page *{
      position:relative;
      z-index:3;
    }

    #landing-avatar{
      width:170px;
      height:170px;

      border-radius:50%;
      object-fit:cover;

      border:
      4px solid rgba(255,255,255,0.14);

      box-shadow:
      0 20px 60px rgba(124,92,255,0.35);

      margin-bottom:2rem;

      animation:
      float 5s
      ease-in-out infinite;

      transition:
      transform .25s ease-out;
    }

    @keyframes float{

      0%{
        transform:translateY(0px);
      }

      50%{
        transform:translateY(-12px);
      }

      100%{
        transform:translateY(0px);
      }
    }

    #landing-title{
      font-size:4.6rem;
      font-weight:800;

      background:
      linear-gradient(
        90deg,
        #fff,
        var(--accent),
        var(--accent2)
      );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      margin-bottom:1rem;
    }

    #landing-subtitle{
      color:#cfcfcf;
      font-size:1.2rem;
      margin-bottom:1rem;
    }

    #typed{
      color:var(--accent2);
      min-height:30px;
      margin-bottom:2rem;
      font-size:1.08rem;
    }

    /* =========================
       BUTTONS
    ========================= */

    #landing-buttons{
      display:flex;
      gap:1rem;
      flex-wrap:wrap;
      justify-content:center;
      margin-bottom:3rem;
    }

    .btn{
      border:none;

      padding:.9rem 2rem;

      border-radius:999px;

      background:
      linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );

      color:white;
      font-weight:600;

      cursor:pointer;

      transition:.35s ease;

      box-shadow:
      0 10px 30px rgba(124,92,255,0.3);
    }

    .btn:hover{
      transform:
      translateY(-4px)
      scale(1.03);

      box-shadow:
      0 20px 45px rgba(124,92,255,0.4);
    }

    /* =========================
       INFO CARDS
    ========================= */

    .info-cards{
      width:100%;
      max-width:900px;

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(200px,1fr));

      gap:1.5rem;
    }

    .card{
      background:rgba(255,255,255,0.06);

      border:
      1px solid rgba(255,255,255,0.08);

      border-radius:24px;

      padding:2rem;

      backdrop-filter:blur(18px);

      transition:.4s ease;

      box-shadow:
      0 10px 35px rgba(0,0,0,0.25);
    }

    .card:hover{
      transform:translateY(-10px);

      box-shadow:
      0 20px 50px rgba(124,92,255,0.3);
    }

    .icon{
      font-size:2rem;
      margin-bottom:1rem;
    }

    .label{
      color:#bdbdbd;
      font-size:.9rem;
      margin-bottom:.5rem;
    }

    .value{
      font-size:1.3rem;
      font-weight:700;
    }

    /* =========================
       MAIN CONTENT
    ========================= */

    #site-contents{
      max-width:1100px;
      margin:90px auto 3rem;
      padding:0 1rem;
      display:none;
    }

    .panel{
      background:rgba(255,255,255,0.06);

      border:
      1px solid rgba(255,255,255,0.08);

      border-radius:30px;

      padding:3rem;

      backdrop-filter:blur(18px);

      color:#d7d7d7;

      line-height:1.8;

      box-shadow:
      0 10px 35px rgba(0,0,0,0.25);
    }

    .projects-title{
      font-size:2.5rem;
      margin-bottom:2rem;

      background:
      linear-gradient(
        90deg,
        #fff,
        var(--accent)
      );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .projects-grid{
      display:grid;

      grid-template-columns:
      repeat(auto-fill,minmax(260px,1fr));

      gap:2rem;
    }

    .card-container{
      perspective:1000px;
      height:220px;
      cursor:pointer;
    }

    .card-inner{
      position:relative;

      width:100%;
      height:100%;

      transition:transform .7s;

      transform-style:preserve-3d;
    }

    .card-container.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .card-front,
    .card-back{
      position:absolute;

      width:100%;
      height:100%;

      border-radius:24px;

      padding:1.5rem;

      background:rgba(255,255,255,0.06);

      border:
      1px solid rgba(255,255,255,0.08);

      backdrop-filter:blur(18px);

      display:flex;
      flex-direction:column;

      justify-content:center;
      align-items:center;

      text-align:center;

      backface-visibility:hidden;

      box-shadow:
      0 10px 35px rgba(0,0,0,0.25);
    }

    .card-back{
      transform:rotateY(180deg);
    }

    .card-img{
      width:70px;
      height:70px;

      border-radius:18px;
      object-fit:cover;

      margin-bottom:1rem;
    }

    .card-title{
      font-size:1.2rem;
      font-weight:700;
      margin-bottom:.5rem;
    }

    #main-content img{
      max-width:100%;
      border-radius:16px;
      display:block;
      margin:1rem auto;
    }

    a{
      color:var(--accent2);
    }

    @media(max-width:768px){

      #landing-title{
        font-size:2.8rem;
      }

      #top-nav{
        padding:0 1rem;
      }

      .nav-links{
        gap:1rem;
      }
    }

  </style>

</head>

<body>

  <!-- STARS -->
  <div class="stars" id="stars"></div>

  <!-- ELECTRICITY -->
  <div class="electricity" id="electricity"></div>

  <!-- GLOW -->
  <div class="blob"></div>

  <!-- LANDING -->
  <main id="landing-page">

    <img
      id="landing-avatar"
      src="pic.jpeg"
      alt="Abhijeet Vaibhav"
    />

    <h1 id="landing-title">
      Abhijeet Vaibhav
    </h1>

    <p id="landing-subtitle">
      B.Tech + M.Tech (Dual Degree),
      Electrical Engineering,
      IIT Bombay
    </p>

    <p id="typed"></p>

    <div id="landing-buttons">

      <button
        class="btn"
        onclick="showProjects()">

        View Projects

      </button>

      <button
        class="btn"
        onclick="alert('Resume is not linked!')">

        Download Resume

      </button>

      <button
        class="btn"
        onclick="showAbout()">

        About

      </button>

    </div>

    <div class="info-cards">

      <div class="card">

        <div class="icon">
          <i class="fa-solid fa-code"></i>
        </div>

        <div class="label">
          Projects
        </div>

        <div
          class="value"
          id="proj-count">

          4

        </div>

      </div>

      <div class="card">

        <div class="icon">
          <i class="fa-solid fa-school"></i>
        </div>

        <div class="label">
          College
        </div>

        <div class="value">
          IIT Bombay
        </div>

      </div>

      <div class="card">

        <div class="icon">
          <i class="fa-solid fa-envelope"></i>
        </div>

        <div class="label">
          Email
        </div>

        <div class="value">
          •••
        </div>

      </div>

      <div
        class="card"
        onclick="window.open('https://linkedin.com/in/theabhijeetvaibhav','_blank')"
        style="cursor:pointer;"
      >

        <div class="icon">
          <i class="fa-brands fa-linkedin"></i>
        </div>

        <div class="label">
          LinkedIn
        </div>

        <div class="value">
          Profile
        </div>

      </div>

    </div>

  </main>

  <!-- NAVBAR -->
  <nav id="top-nav">

    <div class="nav-logo">
      Abhijeet Vaibhav
    </div>

    <div
      class="nav-links"
      id="nav-links-top"
    >

      <span onclick="showLanding()">
        Home
      </span>

      <span onclick="showAbout()">
        About
      </span>

      <span onclick="showProjects()">
        Projects
      </span>

      <span onclick="alert('Resume is not linked!')">
        Resume
      </span>

    </div>

  </nav>

  <!-- MAIN CONTENT -->
  <div id="site-contents">

    <section
      class="panel"
      id="main-content"
      style="display:none;"
    ></section>

    <section
      class="projects-section"
      id="projects-section"
      style="display:none;"
    >

      <h2 class="projects-title">
        My Projects
      </h2>

      <div
        class="projects-grid"
        id="projects-grid"
      ></div>

    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>

    /* TYPED */

    const typed = new Typed('#typed', {

      strings:[
        'Passionate about AI',
        'Machine Learning Enthusiast',
        'Software Developer',
        'Open Source Contributor'
      ],

      typeSpeed:50,
      backSpeed:40,
      backDelay:1800,
      loop:true,
      showCursor:false

    });

    /* PROJECTS */

    const projects = [
  {
    name:"WAL.AI",
    repo:"imabhivaibhav/BNS.AI",
    readme:true,
    img:"https://cdn.jsdelivr.net/gh/imabhivaibhav/default@main/project-icon.png",
    desc:"AI model to get BNS section (BNS) by case details"
  },

  {
    name:"ATM Predictive Maintenance",
    repo:"imabhivaibhav/atm_predictive_maintenance",
    readme:true,
    img:"https://cdn.jsdelivr.net/gh/imabhivaibhav/default@main/project-icon.png",
    desc:"Model to predict ATM Failure to reduce maintenance time"
  },

  {
    name:"Named Entity Recognition (NER)",
    repo:"imabhivaibhav/NER",
    readme:true,
    img:"https://cdn.jsdelivr.net/gh/imabhivaibhav/edl.iitb@main/project-icon.png",
    desc:"Named Entity Recognition (NER) with Bi-LSTM & Character CNN"
  },

  {
    name:"Spectrometry",
    repo:"imabhivaibhav/edl.iitb",
    readme:true,
    img:"https://cdn.jsdelivr.net/gh/imabhivaibhav/edl.iitb@main/project-icon.png",
    desc:"Spectrometry toolkit and analysis."
  },

  {
    name:"Heart Failure Detector",
    repo:"imabhivaibhav/heart_failure",
    readme:true,
    img:"https://cdn.jsdelivr.net/gh/imabhivaibhav/heart_failure@main/project-icon.png",
    desc:"A tool for early detection of heart failure using ML."
  }
];

    document.getElementById(
      "proj-count"
    ).innerText = projects.length;

    /* NAVIGATION */

    function showLanding(){

      document.getElementById(
        'landing-page'
      ).style.display='flex';

      document.getElementById(
        'electricity'
      ).style.display='block';

      document.getElementById(
        'top-nav'
      ).style.display='none';

      document.getElementById(
        'site-contents'
      ).style.display='none';
    }

    function prepareMainSite(){

      document.getElementById(
        'landing-page'
      ).style.display='none';

      document.getElementById(
        'electricity'
      ).style.display='none';

      document.getElementById(
        'top-nav'
      ).style.display='flex';

      document.getElementById(
        'site-contents'
      ).style.display='block';
    }

    function showAbout(){

      prepareMainSite();

      document.getElementById(
        'main-content'
      ).style.display='block';

      document.getElementById(
        'projects-section'
      ).style.display='none';

      document.getElementById(
        'main-content'
      ).innerHTML = `

      <h1>About Me</h1>

      <p>

      <strong>College:</strong>
      IIT Bombay

      <br><br>

      Passionate about technology,
      AI, and software development.

      </p>

      `;
    }

    function showProjects(){

      prepareMainSite();

      document.getElementById(
        'main-content'
      ).style.display='none';

      document.getElementById(
        'projects-section'
      ).style.display='block';

      let html='';

      projects.forEach((proj,idx)=>{

        html += `

        <div
          class="card-container"
          onclick="loadProjectContent(${idx})"
        >

          <div class="card-inner">

            <div class="card-front">

              <img
                src="${proj.img}"
                class="card-img"
              >

              <div class="card-title">
                ${proj.name}
              </div>

              <div>
                ${proj.desc}
              </div>

            </div>

            <div class="card-back">
              Click to view project details
            </div>

          </div>

        </div>

        `;
      });

      document.getElementById(
        'projects-grid'
      ).innerHTML = html;

      document.querySelectorAll(
        '.card-container'
      ).forEach(container=>{

        container.addEventListener(
          'mouseenter',
          ()=>{
            container.classList.add(
              'flipped'
            );
          }
        );

        container.addEventListener(
          'mouseleave',
          ()=>{
            container.classList.remove(
              'flipped'
            );
          }
        );

      });
    }

    function loadProjectContent(idx){

      const proj = projects[idx];

      const mainContent =
      document.getElementById(
        'main-content'
      );

      document.getElementById(
        'projects-section'
      ).style.display='none';

      mainContent.style.display='block';

      const url =
      `https://raw.githubusercontent.com/${proj.repo}/main/README.md`;

      fetch(url)

      .then(res=>res.text())

      .then(md=>{

        mainContent.innerHTML =
        marked.parse(md);

      })

      .catch(()=>{

        mainContent.innerHTML =
        '<p>Could not load README.</p>';

      });

    }

    /* STARS */

    const starsContainer =
    document.getElementById('stars');

    for(let i=0;i<260;i++){

      const star =
      document.createElement('div');

      star.classList.add('star');

      if(Math.random() > 0.82){
        star.classList.add('big');
      }

      star.style.left =
      Math.random()*100 + 'vw';

      star.style.top =
      Math.random()*100 + 'vh';

      star.style.animationDuration =
      (Math.random()*10 + 8) + 's';

      star.style.animationDelay =
      Math.random()*-20 + 's';

      starsContainer.appendChild(star);
    }

    /* ELECTRICITY */

    const electricity =
    document.getElementById(
      'electricity'
    );

    for(let i=0;i<60;i++){

      const bolt =
      document.createElement('div');

      bolt.classList.add('bolt');

      bolt.style.left =
      Math.random()*100 + '%';

      bolt.style.height =
      (Math.random()*160 + 60) + 'px';

      bolt.style.animationDuration =
      (Math.random()*2 + 1.2) + 's';

      bolt.style.animationDelay =
      Math.random()*-5 + 's';

      electricity.appendChild(bolt);
    }

    /* AVATAR MOVEMENT */

    const avatar =
    document.getElementById(
      'landing-avatar'
    );

    avatar.addEventListener(
      'mouseenter',
      ()=>{

        const randomX =
        (Math.random()-0.5)*520;

        const randomY =
        (Math.random()-0.5)*320;

        avatar.style.transform =
        `translate(${randomX}px,${randomY}px)
        rotate(${Math.random()*30-15}deg)
        scale(1.08)`;

      }
    );

    avatar.addEventListener(
      'mouseleave',
      ()=>{

        setTimeout(()=>{

          avatar.style.transform =
          'translate(0px,0px) rotate(0deg) scale(1)';

        },350);

      }
    );

    /* INITIAL */

    showLanding();

  </script>

</body>
</html>
