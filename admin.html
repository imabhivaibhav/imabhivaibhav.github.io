<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Admin Portal | Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #070b19; color: #fff; min-height: 100vh; padding: 2rem; }
    
    .container { max-width: 1000px; margin: 0 auto; }
    .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; backdrop-filter: blur(20px); }
    
    h1, h2 { background: linear-gradient(90deg, #fff, #7c5cff, #5ce1e6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Login Screen */
    .login-box { max-width: 400px; margin: 100px auto; text-align: center; }
    .form-control { width: 100%; padding: 0.9rem 1.2rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; margin-bottom: 1rem; outline: none; }
    
    /* Buttons */
    .btn { padding: 0.8rem 1.5rem; border-radius: 99px; border: none; background: linear-gradient(135deg, #7c5cff, #5ce1e6); color: white; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); color: #f87171; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    
    /* Inbox Table */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
    th { color: #5ce1e6; font-size: 0.85rem; text-transform: uppercase; }
    tr.msg-row { cursor: pointer; transition: 0.2s; }
    tr.msg-row:hover { background: rgba(124, 92, 255, 0.1); }
    
    /* Side Drawer Panel */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: flex-end; z-index: 100; }
    .drawer { width: 100%; max-width: 450px; background: #0f172a; height: 100%; padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; border-left: 1px solid rgba(255,255,255,0.1); }
    .drawer-body { background: rgba(255,255,255,0.03); padding: 1.2rem; border-radius: 12px; margin-top: 1.5rem; line-height: 1.6; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="auth-section" class="card login-box">
    <h2>Admin Login</h2>
    <p style="color: #aaa; margin-bottom: 1.5rem; font-size: 0.9rem;">Sign in to view portfolio messages</p>
    <input type="email" id="admin-email" class="form-control" placeholder="Admin Email" />
    <input type="password" id="admin-pass" class="form-control" placeholder="Password" />
    <button onclick="login()" class="btn" style="width: 100%;">Login to Terminal</button>
  </div>

  <div id="dashboard-section" class="container card" style="display: none;">
    <div class="header-bar">
      <div>
        <h1>Personal Messages</h1>
        <p style="color: #aaa; font-size: 0.9rem;">Live submissions from your landing page</p>
      </div>
      <button onclick="logout()" class="btn-danger">Logout</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Email</th>
          <th>Snippet</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="message-rows">
        <tr><td colspan="5">Loading messages...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="drawer-overlay" class="drawer-overlay">
    <div class="drawer">
      <div>
        <h3 id="drawer-name">Sender Name</h3>
        <p id="drawer-email" style="color: #5ce1e6; font-size: 0.9rem; margin-top: 4px;"></p>
        <p id="drawer-date" style="color: #888; font-size: 0.8rem; margin-top: 4px;"></p>
        
        <div class="drawer-body" id="drawer-msg">Message content...</div>
      </div>
      
      <div style="display: flex; gap: 10px; margin-top: 2rem;">
        <button onclick="closeDrawer()" class="btn" style="background: rgba(255,255,255,0.1); flex: 1;">Close</button>
        <button id="delete-btn" class="btn-danger" style="flex: 1;">Delete Message</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeMsgId = null;

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        fetchMessages();
        listenToRealtime();
      }
    }

    async function login() {
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-pass').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert(error.message);
      else checkSession();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function fetchMessages() {
      const { data: messages, error } = await supabaseClient
        .from('personal_messages')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      const tbody = document.getElementById('message-rows');
      if (messages.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="color:#888;">No messages received yet.</td></tr>';
        return;
      }

      tbody.innerHTML = messages.map(m => `
        <tr class="msg-row" onclick="openDrawer('${m.id}', '${encodeURIComponent(m.name)}', '${m.email}', '${encodeURIComponent(m.message)}', '${new Date(m.created_at).toLocaleString()}')">
          <td>${new Date(m.created_at).toLocaleDateString()}</td>
          <td><strong>${m.name}</strong></td>
          <td style="color: #aaa;">${m.email}</td>
          <td>${m.message.length > 40 ? m.message.substring(0, 40) + '...' : m.message}</td>
          <td>
            <button class="btn-danger" onclick="event.stopPropagation(); deleteMessage('${m.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function openDrawer(id, name, email, msg, date) {
      activeMsgId = id;
      document.getElementById('drawer-name').innerText = decodeURIComponent(name);
      document.getElementById('drawer-email').innerText = email;
      document.getElementById('drawer-date').innerText = date;
      document.getElementById('drawer-msg').innerText = decodeURIComponent(msg);
      document.getElementById('delete-btn').onclick = () => deleteMessage(id);
      
      document.getElementById('drawer-overlay').style.display = 'flex';
    }

    function closeDrawer() {
      document.getElementById('drawer-overlay').style.display = 'none';
    }

    async function deleteMessage(id) {
      if (confirm("Delete this message permanently?")) {
        await supabaseClient.from('personal_messages').delete().eq('id', id);
        closeDrawer();
        fetchMessages();
      }
    }

    // Realtime Sync (Naya message aate hi auto refresh hoga)
    function listenToRealtime() {
      supabaseClient
        .channel('schema-db-changes')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'personal_messages' }, () => {
          fetchMessages();
        })
        .subscribe();
    }

    checkSession();
  </script>
</body>
</html>
