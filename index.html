<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@theabhijeetvaibhav | Belicit</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/imabhivaibhav/imabhivaibhav.github.io/main/icon.png">

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="stars" id="stars"></div>
  <div class="electricity" id="electricity"></div>
  <div class="blob"></div>

  <main id="landing-page">
    <img
      id="landing-avatar"
      src="https://raw.githubusercontent.com/imabhivaibhav/imabhivaibhav.github.io/main/pic.jpeg"
      alt="Abhijeet Vaibhav"
    />

    <h1 id="landing-title">Abhijeet Vaibhav</h1>

    <p id="landing-subtitle">
      B.Tech + M.Tech (Dual Degree), Electrical Engineering, IIT Bombay
    </p>

    <p id="typed"></p>

    <div id="landing-buttons">
      <button class="btn" onclick="showProjects()">View Projects</button>
      <button class="btn" onclick="showResume()">Resume</button>
      <button class="btn" onclick="showAbout()">About</button>
      <button class="btn" onclick="showMessage()">Message</button>
    </div>

    <div class="info-cards">
      <div class="card" onclick="showProjects()" style="cursor:pointer;">
        <div class="icon"><i class="fa-solid fa-code"></i></div>
        <div class="label">Projects</div>
        <div class="value" id="proj-count">4</div>
      </div>

      <div class="card">
        <div class="icon"><i class="fa-solid fa-school"></i></div>
        <div class="label">College</div>
        <div class="value">IIT Bombay</div>
      </div>

      <div class="card" onclick="showMessage()" style="cursor:pointer;">
        <div class="icon"><i class="fa-solid fa-envelope"></i></div>
        <div class="label">Email</div>
        <div class="value" style="font-size:0.9rem; overflow-wrap:anywhere; word-break:break-word; text-align:center;">
          abhijeetvaibhav@belicit.com
        </div>
      </div>

      <div class="card" onclick="window.open('https://linkedin.com/in/theabhijeetvaibhav','_blank')" style="cursor:pointer;">
        <div class="icon"><i class="fa-brands fa-linkedin"></i></div>
        <div class="label">LinkedIn</div>
        <div class="value">Profile</div>
      </div>
    </div>
  </main>

  <nav id="top-nav">
    <div class="nav-logo">
      <img src="https://raw.githubusercontent.com/imabhivaibhav/imabhivaibhav.github.io/main/icon.png" alt="Logo" />
    </div>

    <div class="nav-links" id="nav-links-top">
      <span onclick="showLanding()">Home</span>
      <span onclick="showAbout()">About</span>
      <span onclick="showMessage()">Message</span>
      <span onclick="showProjects()">Projects</span>
      <span onclick="showResume()">Resume</span>
    </div>
  </nav>

  <div id="site-contents">
    <section class="panel" id="main-content" style="display:none;"></section>

    <section class="projects-section" id="projects-section" style="display:none;">
      <h2 class="projects-title">My Projects</h2>
      <div class="projects-grid" id="projects-grid"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  
</body>
</html>
